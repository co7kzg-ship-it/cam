<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cam</title>
<style>
*{box-sizing:border-box}
body{margin:0;font:20px/1.45 system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;background:#d5d8dd;color:#2c3238;padding:20px}
.w{max-width:640px;margin:0 auto}
h1{font-size:1.7rem;margin:0 0 8px}
p{color:#5c646c;margin:0 0 14px}
.row{display:flex;gap:10px;flex-wrap:wrap;margin:16px 0}
button,input{font:inherit;border:1px solid #b8bec6;background:#e4e6ea;color:#2c3238;padding:12px 14px}
button{font-weight:700;cursor:pointer}
button.go{background:#2d6b4f;color:#f4f1ec;border-color:#2d6b4f}
button:disabled{opacity:.4}
input{letter-spacing:.2em;text-transform:uppercase;width:8em;font-weight:700}
.box{display:none;background:#e4e6ea;border:1px solid #b8bec6;padding:16px;margin-top:12px}
.box.on{display:block}
.code{font:2.4rem/1.1 ui-monospace,Menlo,Consolas,monospace;letter-spacing:.25em;margin:10px 0;font-weight:700}
video{width:100%;background:#2c3238;margin-top:12px;display:block;max-height:70vh}
.st{margin-top:10px;min-height:1.3em}
.bad{color:#9a3f3a}
.ok{color:#2d6b4f}
</style>
</head>
<body>
<div class="w">
  <h1>Phone → PC camera</h1>
  <p>Same Wi‑Fi. No port. No copy of SDP. PC shows a code, phone types it.</p>
  <div class="row">
    <button class="go" id="asPc" type="button">This is the PC</button>
    <button id="asPhone" type="button">This is the phone</button>
  </div>

  <div class="box" id="pcBox">
    <p>Leave this tab open. On the phone open this same site and enter:</p>
    <div class="code" id="code">····</div>
    <video id="remote" playsinline autoplay controls></video>
    <div class="st" id="pcSt">Getting a code…</div>
  </div>

  <div class="box" id="phBox">
    <p>Allow the camera, type the PC code, tap Go.</p>
    <div class="row">
      <input id="pin" maxlength="4" placeholder="CODE" autocomplete="off">
      <button class="go" id="go" type="button">Go</button>
    </div>
    <video id="local" playsinline muted autoplay></video>
    <div class="st" id="phSt"></div>
  </div>
</div>
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script>
(function () {
  function $(id) { return document.getElementById(id); }
  function say(id, m, k) {
    $(id).textContent = m;
    $(id).className = "st" + (k ? " " + k : "");
  }
  function pin4() {
    const a = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
    let s = "";
    for (let i = 0; i < 4; i++) s += a[Math.floor(Math.random() * a.length)];
    return s;
  }
  const ns = "c7cam-";

  $("asPc").onclick = function () {
    $("pcBox").classList.add("on");
    $("phBox").classList.remove("on");
    const code = pin4();
    $("code").textContent = code;
    say("pcSt", "Waiting for the phone…");
    const peer = new Peer(ns + code, { debug: 0 });
    peer.on("error", function (e) {
      say("pcSt", e.type === "unavailable-id" ? "Code taken, reload." : String(e), "bad");
    });
    peer.on("open", function () {
      say("pcSt", "Ready. Enter " + code + " on the phone.", "ok");
    });
    peer.on("call", function (call) {
      call.answer();
      call.on("stream", function (s) {
        $("remote").srcObject = s;
        say("pcSt", "Live.", "ok");
      });
      call.on("close", function () { say("pcSt", "Phone left."); });
    });
  };

  $("asPhone").onclick = function () {
    $("phBox").classList.add("on");
    $("pcBox").classList.remove("on");
    $("pin").focus();
  };

  $("go").onclick = async function () {
    const code = ($("pin").value || "").trim().toUpperCase();
    if (code.length < 4) { say("phSt", "Enter the 4-character code.", "bad"); return; }
    try {
      if (!navigator.mediaDevices || !location.protocol.startsWith("https")) {
        say("phSt", "Need https + camera permission.", "bad");
        return;
      }
      const stream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: { ideal: "environment" } },
        audio: false
      });
      $("local").srcObject = stream;
      const peer = new Peer(undefined, { debug: 0 });
      peer.on("error", function (e) { say("phSt", String(e), "bad"); });
      peer.on("open", function () {
        const call = peer.call(ns + code, stream);
        if (!call) { say("phSt", "Could not call PC.", "bad"); return; }
        call.on("error", function (e) { say("phSt", String(e), "bad"); });
        say("phSt", "Sending… keep this tab open.", "ok");
      });
    } catch (e) {
      say("phSt", String(e.message || e), "bad");
    }
  };
})();
</script>
</body>
</html>
